[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "AlwaysCloudSkip"
description = "Enables Cloud Skip (double jump) at all times."
websiteUrl = "https://github.com/Little-Sparroh/AlwaysCloudSkip"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/net48/AlwaysCloudSkip.dll"
target = "BepInEx/plugins/AlwaysCloudSkip.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "client" ]
